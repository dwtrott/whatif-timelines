[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatif-timelines"
version = "0.1.0"
description = "Counterfactual timeline forecasting with an LLM agent swarm (MiroFish-inspired), with a git-graph timeline GUI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "mwparserfromhell>=0.6"]

[project.scripts]
whatif = "whatif.__main__:main"

[tool.setuptools]
packages = ["whatif"]

[tool.setuptools.package-data]
whatif = ["static/*"]
